repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.16
    hooks:
      - id: ruff-check
        files: ^src/
      - id: ruff-format
        files: ^src/
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.1.0
    hooks:
      - id: mypy
        additional_dependencies:
          - pydantic
          - pydantic-ai
          - textual
          - rich
          - click
          - keyring
          - platformdirs
          - httpx
