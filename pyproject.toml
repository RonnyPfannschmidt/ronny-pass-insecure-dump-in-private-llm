[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "ronny-pass-analysis-lm"
dynamic = ["version"]
description = "Analyze a pass password store using a self-hosted LLM"
readme = "README.md"
license = "MIT"
requires-python = ">=3.14"
authors = [
  { name = "Ronny Pfannschmidt", email = "opensource@ronnypfannschmidt.de" },
]
keywords = ["pass", "password", "llm", "security", "analysis"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "Topic :: Security",
  "Topic :: Utilities",
]
dependencies = [
  "click>=8.4.1",
  "keyring>=25.7.0",
  "platformdirs>=4.10.0",
  "pydantic-ai>=1.106.0",
  "rich>=15.0.0",
]

[project.optional-dependencies]
tui = [
  "textual>=8.2.7",
]

[dependency-groups]
dev = [
  "pytest>=9.0.3",
  "pytest-asyncio>=1.4.0",
  "ruff>=0.15.16",
  "mypy>=2.1.0",
  "textual>=8.2.7",
]

[project.scripts]
pass-analysis-lm = "ronny.pass_analysis_lm.cli:main"

[tool.uv]
default-groups = ["dev"]

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["src/ronny"]

[tool.ruff]
src = ["src"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.14"
strict = true
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
